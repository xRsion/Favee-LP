<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favee お問い合わせ</title>
    <meta name="description" content="Faveeアプリについてのご質問や不具合のご連絡はこちらからお問い合わせください。">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">

        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #f472b6, #fbbf24);
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 bg-purple-600 text-white p-2 z-50">メインコンテンツにスキップ</a>
    
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-40 bg-black/90 border-b border-gray-800" aria-label="メインナビゲーション">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center py-3">
                <div class="flex items-center gap-8">
                    <a href="/" class="flex items-center gap-2" aria-label="Faveeホームページ">
                        <img src="/assets/images/logo.png" class="h-[30px]" alt="Favee">
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="text-white hover:text-gray-300 text-sm transition duration-300">
                        ホームに戻る
                    </a>
                    
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-24 pb-16"><div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8"><div class="bg-white shadow-md rounded-lg px-6 py-8"><section class="favee-support" aria-labelledby="support-title">
  <h1 id="support-title">Favee お問い合わせ</h1>
  <p>アプリについてのご質問や、不具合のご連絡を受け付けています。</p>
  <form id="favee-support-form" novalidate>
    <label>お名前 <span>必須</span><input name="name" autocomplete="name" required maxlength="100"></label>
    <label>返信先メールアドレス <span>必須</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label>
    <label>お問い合わせの種類<select name="category"><option>アプリの使い方</option><option>不具合の報告</option><option>購入・課金について</option><option>アカウントについて</option><option>個人情報について</option><option>その他</option></select></label>
    <label>お問い合わせ内容 <span>必須</span><textarea name="message" required rows="8" maxlength="5000"></textarea></label>
    <div class="favee-trap" aria-hidden="true"><label>Website<input name="website" autocomplete="off" tabindex="-1"></label></div>
    <p class="favee-hint">不具合については、端末・OS・アプリのバージョンもお知らせください。パスワードやカード番号は入力しないでください。</p>
    <label class="favee-consent"><input name="consent" type="checkbox" required><span><a href="/privacy/">プライバシーポリシー</a>を確認し、お問い合わせへの回答・連絡のために入力内容を利用することに同意します。</span></label>
    <button type="submit" disabled>送信の準備中です</button>
    <p id="favee-support-status" role="status" aria-live="polite">送信の準備をしています。</p>
  </form>
</section>
<style>.favee-support{max-width:760px;margin:0 auto;padding:24px 0}.favee-support h1{font-size:30px;line-height:1.5;margin:0 0 24px;font-weight:700}.favee-support p{line-height:1.9;margin:0 0 24px}.favee-support form{display:grid;gap:22px}.favee-support label{display:grid;gap:8px;line-height:1.7}.favee-support label>span{font-size:14px}.favee-support input:not([type=checkbox]),.favee-support textarea,.favee-support select{box-sizing:border-box;width:100%;border:1px solid #71877e;background:#fff;color:#152c24;border-radius:6px;padding:12px;font:inherit}.favee-support input:focus,.favee-support textarea:focus,.favee-support select:focus{outline:2px solid #286d52;outline-offset:2px}.favee-support .favee-consent{display:flex;align-items:flex-start;gap:12px}.favee-consent input{margin-top:6px;flex-shrink:0;width:18px;height:18px}.favee-support button{padding:14px 24px;border:0;border-radius:6px;background:#205a45;color:#fff;font:inherit;font-weight:700;cursor:pointer}.favee-support button:disabled{opacity:.55;cursor:default}.favee-support a{color:#145e42;text-decoration:underline;text-underline-offset:3px}.favee-support .favee-hint{font-size:14px;margin:0}.favee-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}#favee-support-status{min-height:28px;margin:0}.favee-support textarea{resize:vertical}@media(max-width:640px){.favee-support h1{font-size:26px}}</style>
<script src="/assets/favee-support.js" defer></script>
